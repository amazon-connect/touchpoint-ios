name: Demo backend

# The Acme Bank demo's AWS CDK backend (Demo/backend): type-check, unit tests and a synth. Needs no
# AWS credentials and deploys nothing. Runs only when the backend or the action contract it reads
# from the app changes.
on:
  pull_request:
    paths:
      - 'Demo/backend/**'
      - 'Demo/AcmeBank/Resources/ActionContract/**'
      - '.github/workflows/demo-backend.yml'
  push:
    branches: [main]
    paths:
      - 'Demo/backend/**'
      - 'Demo/AcmeBank/Resources/ActionContract/**'
      - '.github/workflows/demo-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-backend-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: demo backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Demo/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Demo/backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: cdk synth
        run: npx cdk synth --quiet -c instanceId=00000000-0000-0000-0000-000000000000
        env:
          AWS_REGION: us-west-2
          CDK_DEFAULT_ACCOUNT: '000000000000'
