name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the API check compares with the last release tag
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # The AWS SDK for Swift alone is about 3 GB to resolve; keep the checkouts between runs.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Version and changelog
        run: sh Scripts/check-version.sh

      - name: make check
        run: make check

      - name: make build-ios
        run: make build-ios

      - name: API compatibility with the last release
        run: sh Scripts/check-api-breaks.sh

      # Every pull request also lists its public API changes against its base, for the reviewer.
      - name: Public API changes in this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: sh Scripts/check-api-breaks.sh --report-only "origin/$BASE_REF"
